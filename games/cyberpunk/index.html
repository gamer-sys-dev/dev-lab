    // Corrected Touch Math mapping container size to actual drawn canvas bounds
    function handleTouch(e, isDown) {
        if (gameState !== 'CHARACTER_CREATION') e.preventDefault();
        const rect = canvas.getBoundingClientRect(); 
        
        // Calculate true scaling factor resolving CSS object-fit: contain
        const scale = Math.min(rect.width / 800, rect.height / 600);
        const offsetX = (rect.width - (800 * scale)) / 2;
        const offsetY = (rect.height - (600 * scale)) / 2;

        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i]; 
            const tx = (touch.clientX - rect.left - offsetX) / scale;
            const ty = (touch.clientY - rect.top - offsetY) / scale;
            const id = touch.identifier;
            
            if (gameState === 'CHARACTER_CREATION') { if(isDown) mobileInput.focus(); continue; }
            
            let hitKey = null;

            if (gameState === 'EXPLORE') {
                if (vPad.isHitCircle(tx, ty, vPad.buttons.left)) hitKey = 'ArrowLeft'; 
                else if (vPad.isHitCircle(tx, ty, vPad.buttons.right)) hitKey = 'ArrowRight'; 
                else if (vPad.isHitCircle(tx, ty, vPad.buttons.jump)) hitKey = 'Space'; 
                else if (vPad.isHitRect(tx, ty, vPad.buttons.menuU)) hitKey = 'KeyU'; 
                else if (vPad.isHitRect(tx, ty, vPad.buttons.menuI)) hitKey = 'KeyI';
            } 
            else if (['COMBAT', 'UPGRADE_MENU', 'INVENTORY_MENU', 'AMULET_SELECTION'].includes(gameState)) {
                if (vPad.isHitCircle(tx, ty, vPad.buttons.up)) hitKey = 'ArrowUp'; 
                else if (vPad.isHitCircle(tx, ty, vPad.buttons.down)) hitKey = 'ArrowDown'; 
                else if (vPad.isHitCircle(tx, ty, vPad.buttons.action) || tx > 400) hitKey = 'Enter'; // Massive right-screen hitzone
            } 
            else if (gameState === 'TOURNAMENT_LOBBY') {
                if (vPad.isHitRect(tx, ty, vPad.buttons.menuU)) hitKey = 'KeyU'; 
                else if (vPad.isHitRect(tx, ty, vPad.buttons.menuI)) hitKey = 'KeyI';
                else if (tx > 600 && ty > 400) hitKey = 'KeyR';
                else hitKey = 'Enter'; // Tap anywhere else to start
            }
            else if (gameState === 'BOSS_PROMPT') {
                if (tx < 400) hitKey = 'Y'; else hitKey = 'N'; 
            }
            else {
                hitKey = 'Enter'; // Tap absolutely anywhere to continue dialogue/chests
            }

            if (isDown && hitKey) { keys[hitKey] = true; vPad.activeTouches[id] = hitKey; } 
            else if (!isDown && vPad.activeTouches[id]) { keys[vPad.activeTouches[id]] = false; delete vPad.activeTouches[id]; }
        }
    }

    }

    function wrapText(text, x, y, maxWidth, lineHeight) {
        if (!text) return; 
        const paragraphs = String(text).split('\n'); let currentY = y;
        for (let p = 0; p < paragraphs.length; p++) {
            const words = paragraphs[p].split(' '); let line = '';
            for(let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > maxWidth && n > 0) { ctx.fillText(line, x, currentY); line = words[n] + ' '; currentY += lineHeight; } 
                else { line = testLine; }
            }
            ctx.fillText(line, x, currentY); currentY += lineHeight + (lineHeight * 0.5);
        }
    }

            if (item.type === 'CURSE') {
                ctx.translate(screenX, item.y); ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 4; ctx.shadowBlur = 15; ctx.shadowColor = '#ff0000'; ctx.beginPath(); ctx.moveTo(0, item.h);
                for (let i = item.h; i >= 0; i -= 10) ctx.lineTo(Math.sin((time * 10) + i) * 10, i); ctx.stroke(); ctx.fillStyle = '#ff0000'; ctx.font = '12px Courier New'; ctx.textAlign = 'center'; ctx.fillText("ANOMALY", 0, -10);
            } else if (item.type === 'BLESSING') {
                const hover = Math.sin(time * 6) * 10; ctx.translate(screenX, item.y + hover); ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3; ctx.shadowBlur = 20; ctx.shadowColor = '#ffd700';
                ctx.beginPath(); ctx.arc(15, 15, 15, 0, Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(15, 15, 8 + Math.sin(time*5)*4, 0, Math.PI*2); ctx.fillStyle = '#ffd700'; ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = '12px Courier New'; ctx.textAlign = 'center'; ctx.fillText("ORB", 15, -10);
            } else if (item.type === 'CHEST' || item.type === 'STAGE_CHEST') {
                ctx.translate(screenX, item.y); const chestColor = item.type === 'STAGE_CHEST' ? '#00ffcc' : '#ff00cc'; ctx.shadowBlur = 20; ctx.shadowColor = chestColor;
                ctx.fillStyle = '#221133'; ctx.fillRect(-15, -20, 30, 20); ctx.fillStyle = chestColor; ctx.fillRect(-15, -20, 30, 5); ctx.fillStyle = '#fff'; ctx.fillRect(-3, -15, 6, 6); 
                if(item.type === 'STAGE_CHEST') { ctx.fillStyle = '#fff'; ctx.font = '10px Courier New'; ctx.textAlign = 'center'; ctx.fillText("EXIT", 0, -30); }
            } else { 
                const hover = Math.sin(time * 6) * 5; ctx.translate(screenX, item.y + hover); ctx.shadowBlur = 15; ctx.shadowColor = item.type === 'HP' ? '#0f0' : '#ff0'; ctx.fillStyle = item.type === 'HP' ? '#0f0' : '#ff0';
                ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(10, 0); ctx.lineTo(0, 10); ctx.lineTo(-10, 0); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = '10px Courier New'; ctx.textAlign = 'center'; ctx.fillText(item.type, 0, -15);
            }
            ctx.restore();
        }
    }

    function update(deltaTime) {
        globalTime += deltaTime;
        for (const drop of rain) { drop.y += drop.speed * deltaTime; drop.x -= (drop.speed * 0.2) * deltaTime; if (drop.y > 600) { drop.y = -20; drop.x = Math.random() * 1000; } }
        if (gameState === 'CHARACTER_CREATION') return;
        if (gameState === 'AMULET_SELECTION') {
            if (keys['ArrowDown']) { amuletMenu.index = Math.min(amuletMenu.index + 1, amuletMenu.options.length - 1); keys['ArrowDown'] = false; }
            if (keys['ArrowUp']) { amuletMenu.index = Math.max(amuletMenu.index - 1, 0); keys['ArrowUp'] = false; }
            if (keys['Enter']) { player.amulet.push(amuletMenu.options[amuletMenu.index].id); player.updateDerivedStats(); gameState = postAmuletState; keys['Enter'] = false; }
        } else if (gameState === 'STORY_INTRO' || gameState === 'STORY_BEAT') {
            if (keys['Enter']) { gameState = currentStage === 3 ? 'TOURNAMENT_LOBBY' : (currentStage === 4 ? 'BOSS_PROMPT' : 'EXPLORE'); keys['Enter'] = false; }
        } else if (gameState === 'TOURNAMENT_LOBBY') {
            if (keys['Enter']) { executeCombatTrigger('TOURNAMENT'); keys['Enter'] = false; }
            if (keys['KeyU']) { gameState = 'UPGRADE_MENU'; upgradeMenu.index = 0; keys['KeyU'] = false; }
            if (keys['KeyI']) { gameState = 'INVENTORY_MENU'; inventoryMenu.index = 0; keys['KeyI'] = false; }
            if (keys['KeyR']) { let spent = (player.stats.str - 5) + (player.stats.vit - 5) + (player.stats.tech - 5) + (player.stats.spd - 5); if (spent > 0) { player.skillPoints += spent; player.stats = { str: 5, vit: 5, tech: 5, spd: 5 }; player.updateDerivedStats(); } keys['KeyR'] = false; }
        } else if (gameState === 'EXPLORE') {
            player.isMoving = false; let dx = 0; if (keys['ArrowRight']) dx = 1; if (keys['ArrowLeft']) dx = -1;
            if (keys['Space'] && !player.isJumping) { player.vy = -600; player.isJumping = true; keys['Space'] = false; }
            if (player.isJumping || player.y < player.baseY) { player.vy += 1500 * deltaTime; player.y += player.vy * deltaTime; if (player.y >= player.baseY) { player.y = player.baseY; player.vy = 0; player.isJumping = false; } }
            if (keys['KeyU']) { gameState = 'UPGRADE_MENU'; upgradeMenu.index = 0; keys['KeyU'] = false; }
            if (keys['KeyI']) { gameState = 'INVENTORY_MENU'; inventoryMenu.index = 0; keys['KeyI'] = false; }
            if (dx !== 0) {
                player.isMoving = true; cameraX += dx * player.speed * deltaTime; player.distanceTraveled += Math.abs(dx * player.speed * deltaTime); spawnEntity();
                const pRect = { x: cameraX + 135, y: player.y - 60, w: 30, h: 60 };
                for (let i = entities.length - 1; i >= 0; i--) {
                    const item = entities[i]; if (!item.active) continue;
                    const eRect = { x: item.globalX - (item.w/2), y: item.y - (item.h/2), w: item.w, h: item.h };
                    if (item.type === 'CURSE') { eRect.y = item.y; eRect.x = item.globalX - 10; }
                    if (item.type === 'CHEST' || item.type === 'STAGE_CHEST') { eRect.y = item.y - 20; }
                    if (pRect.x < eRect.x + eRect.w && pRect.x + pRect.w > eRect.x && pRect.y < eRect.y + eRect.h && pRect.y + pRect.h > eRect.y) {
                        item.active = false;
                        if (item.type === 'CURSE') { player.activeCurse = cursesList[Math.floor(Math.random() * cursesList.length)]; createParticle(150, player.y - 50, `CURSED!`, "#f00"); } 
                        else if (item.type === 'BLESSING') { player.activeBlessing = blessingsList[Math.floor(Math.random() * blessingsList.length)]; player.updateDerivedStats(); createParticle(150, player.y - 50, `BLESSED!`, "#fd0"); } 
                        else if (item.type === 'STAGE_CHEST') { currentLootDisplay = generateChestLoot(); gameState = 'CHEST_REWARD'; keys['Enter'] = false; currentStage = 2; storyText = "Leaving the Neon Slums...\n\nEntering the Global Outskirts.\nSearch this desert zone to find a Cyber-Pet companion."; }
                        else if (item.type === 'CHEST') { currentLootDisplay = generateChestLoot(); gameState = 'CHEST_REWARD'; keys['Enter'] = false; } 
                        else if (item.type === 'HP') { player.hp = Math.min(player.maxHp, player.hp + 30); createParticle(150, player.y - 30, "+30 HP", "#0f0"); } 
                        else { player.xp += 15 * player.level * player.xpMultiplier; processLevelUps(); createParticle(150, player.y - 30, "+XP", "#ff0"); }
                    }
                }
                entities = entities.filter(item => item.active && item.globalX > cameraX - 500 && item.globalX < cameraX + 1500);
                if (player.distanceTraveled > 800 && Math.random() < 0.02) { keys['ArrowLeft']=false; keys['ArrowRight']=false; triggerEncounterCheck(); }
            }
        } 
        else if (gameState === 'BOSS_PROMPT') { if (keys['Y']) { executeCombatTrigger('BOSS'); keys['Y']=false; } else if (keys['N']) { currentStage = 1; stageEnemiesDefeated = 0; storyText = "Retreating to the Neon Slums to train..."; gameState = 'STORY_BEAT'; keys['N'] = false; } }
        else if (gameState === 'CHEST_REWARD') { if (keys['Enter']) { player.inventory.push(currentLootDisplay); if (currentStage === 2 && encounterType === 'STANDARD') gameState = 'STORY_BEAT'; else gameState = 'EXPLORE'; keys['Enter'] = false; } }
        else if (gameState === 'UPGRADE_MENU') {
            if (keys['ArrowDown']) { upgradeMenu.index = Math.min(upgradeMenu.index + 1, upgradeMenu.options.length - 1); keys['ArrowDown'] = false; }
            if (keys['ArrowUp']) { upgradeMenu.index = Math.max(upgradeMenu.index - 1, 0); keys['ArrowUp'] = false; }
            if (keys['Enter']) { const sel = upgradeMenu.options[upgradeMenu.index]; if (sel === 'exit') { gameState = currentStage === 3 ? 'TOURNAMENT_LOBBY' : 'EXPLORE'; } else if (player.skillPoints > 0) { player.stats[sel]++; player.skillPoints--; player.updateDerivedStats(); } keys['Enter'] = false; }
        }
        else if (gameState === 'INVENTORY_MENU') {
            const maxIdx = Math.max(0, player.inventory.length); 
            if (keys['ArrowDown']) { inventoryMenu.index = Math.min(inventoryMenu.index + 1, maxIdx); keys['ArrowDown'] = false; }
            if (keys['ArrowUp']) { inventoryMenu.index = Math.max(inventoryMenu.index - 1, 0); keys['ArrowUp'] = false; }
            if (keys['Enter']) {
                if (inventoryMenu.index === player.inventory.length) { gameState = currentStage === 3 ? 'TOURNAMENT_LOBBY' : 'EXPLORE'; } 
                else if (player.inventory.length > 0) { const selectedItem = player.inventory[inventoryMenu.index]; player.gear[selectedItem.slot] = selectedItem; player.updateDerivedStats(); }
                keys['Enter'] = false;
            }
        }
        else if (gameState === 'COMBAT') {
            for (let i = combat.particles.length - 1; i >= 0; i--) { const p = combat.particles[i]; p.y += p.velocityY * deltaTime; p.life -= deltaTime; if (p.life <= 0) combat.particles.splice(i, 1); }
            if (combat.turnState === 'FILLING') {
                if (player.activeCurse === 'SYSTEM_FREEZE' && Math.random() < 0.01) combat.freezeTimer = 1.0;
                if (combat.freezeTimer > 0) { combat.freezeTimer -= deltaTime; combat.message = "Curse: SYSTEM FROZEN!"; } else { player.atb += player.speedStat * deltaTime; }
                enemy.atb += enemy.speedStat * deltaTime;
                if (player.atb >= player.maxAtb) { player.atb = player.maxAtb; combat.turnState = 'PLAYER_ACTION'; keys['Enter'] = false; 
                } else if (enemy.atb >= enemy.maxAtb) {
                    enemy.atb = enemy.maxAtb;
                    const baseEDmg = encounterType === 'BOSS' ? 20 : (encounterType === 'TOURNAMENT' ? 10 : 5); const dmg = Math.floor(Math.random() * 10) + (baseEDmg * player.level);
                    player.hp -= dmg; createParticle(150, 300, dmg, '#ff0055'); combat.message = `${enemy.attackQuote} (${dmg} dmg!)`; enemy.atb = 0; combat.messageTimer = 2.0;
                    if (player.hp <= 0) { player.hp = 0; gameState = 'GAME_OVER'; }
                }
            } else if (combat.turnState === 'PLAYER_ACTION') {
                if (keys['ArrowDown']) { combat.menuIndex = Math.min(combat.menuIndex+1, 2); keys['ArrowDown'] = false; }
                if (keys['ArrowUp']) { combat.menuIndex = Math.max(combat.menuIndex-1, 0); keys['ArrowUp'] = false; }
                if (keys['Enter']) { executePlayerAction(); keys['Enter'] = false; }
            }
            if (combat.messageTimer > 0) combat.messageTimer -= deltaTime;
        }
    }

    function draw() {
        if (gameState === 'COMBAT' && player.activeCurse === 'BLURRED_VISION') ctx.filter = 'blur(4px)'; else ctx.filter = 'none';
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameState === 'CHARACTER_CREATION') {
            ctx.fillStyle = '#050510'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffcc'; ctx.font = '24px Courier New'; ctx.textAlign = 'center'; ctx.fillText("ENTER OPERATIVE ALIAS:", canvas.width/2, 250);
            ctx.font = 'bold 40px Courier New'; ctx.fillStyle = '#fff'; const cursor = Math.floor(globalTime * 2) % 2 === 0 ? '_' : ''; ctx.fillText(player.name + cursor, canvas.width/2, 320);
            ctx.font = '16px Courier New'; ctx.fillStyle = '#666'; ctx.fillText("[TAP HERE TO TYPE] / [PRESS ENTER TO VERIFY]", canvas.width/2, 500); ctx.textAlign = 'left'; return;
        }
        
        drawParallaxBackground(ctx, cameraX, globalTime, currentStage);
        
        if (gameState === 'AMULET_SELECTION') {
            ctx.fillStyle = 'rgba(20, 0, 40, 0.95)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff00cc'; ctx.font = 'bold 28px Courier New'; ctx.textAlign = 'center'; ctx.fillText(`CHOOSE ANOMALY GEM (SLOT ${player.amulet.length + 1}/4)`, canvas.width/2, 100);
            ctx.fillStyle = '#fff'; ctx.font = '14px Courier New'; ctx.fillText("These gems permanently multiply all overall stats.", canvas.width/2, 150);
            ctx.textAlign = 'left'; const startY = 230;
            for (let i = 0; i < amuletMenu.options.length; i++) {
                ctx.fillStyle = i === amuletMenu.index ? '#00ffcc' : '#aaa'; ctx.fillText(`${i === amuletMenu.index ? '>> ' : '   '} ${amuletMenu.options[i].label}`, 150, startY + (i * 40));
            }
        }
        else if (gameState === 'EXPLORE') {
            entities.forEach(item => { if(item.active) drawEntity(ctx, item, globalTime); });
            drawPlayerCharacter(ctx, player.x, player.y, globalTime, player.isMoving, false);
            ctx.fillStyle = '#fff'; ctx.font = '16px Courier New'; ctx.fillText(`OPERATIVE: ${player.name} [STAGE ${currentStage}]`, 20, 30);
            ctx.fillText(`LVL: ${player.level} | XP: ${player.xp}/${player.nextLevelXp} | HP: ${player.hp}/${player.maxHp} | MP: ${player.mp}/${player.maxMp}`, 20, 50);
            if (player.activeCurse) { ctx.fillStyle = '#ff0000'; ctx.fillText(`CURSE ACTIVE: ${player.activeCurse}`, 20, 80); }
            if (player.activeBlessing) { ctx.fillStyle = '#ffd700'; ctx.fillText(`BLESSING ACTIVE: ${player.activeBlessing}`, 20, 100); }
            if (currentStage === 1) { ctx.fillStyle = '#ff00cc'; ctx.fillText(`Enemies until Checkpoint: ${5 - stageEnemiesDefeated}`, 20, 130); }
        }
        else if (gameState === 'STORY_INTRO' || gameState === 'STORY_BEAT') {
            ctx.fillStyle = 'rgba(0, 5, 15, 0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffcc'; ctx.font = '18px Courier New'; wrapText(storyText, 50, 100, 700, 28);
        }
        else if (gameState === 'TOURNAMENT_LOBBY') {
            drawPlayerCharacter(ctx, 150, 450, globalTime, false, false);
            ctx.fillStyle = 'rgba(0, 10, 20, 0.8)'; ctx.fillRect(100, 100, 600, 360);
            ctx.fillStyle = '#cc00ff'; ctx.font = 'bold 30px Courier New'; ctx.textAlign = 'center'; ctx.fillText("THE UNDERGROUND TOURNAMENT", canvas.width/2, 160);
            ctx.fillStyle = '#fff'; ctx.font = '20px Courier New'; ctx.fillText(`ROUND ${tournamentRound} of 3`, canvas.width/2, 220);
            ctx.fillStyle = '#ffaa00'; ctx.fillText(`Available Points: ${player.skillPoints} (Tap Bottom-R to Reset)`, canvas.width/2, 280); ctx.textAlign = 'left';
        }
        else if (gameState === 'BOSS_PROMPT') {
            ctx.fillStyle = 'rgba(255, 0, 85, 0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 30px Courier New'; ctx.textAlign = 'center'; ctx.fillText("⚠️ OMEGA-CLASS CONSTRUCT DETECTED ⚠️", canvas.width/2, 250);
            ctx.font = '20px Courier New'; ctx.fillText("Are you prepared to engage?", canvas.width/2, 300); ctx.textAlign = 'left';
        }
        else if (gameState === 'CHEST_REWARD') {
            ctx.fillStyle = 'rgba(0, 10, 20, 0.9)'; ctx.fillRect(100, 150, 600, 300); ctx.strokeStyle = '#ff00cc'; ctx.lineWidth = 4; ctx.strokeRect(100, 150, 600, 300);
            ctx.fillStyle = '#ff00cc'; ctx.font = 'bold 24px Courier New'; ctx.textAlign = 'center'; ctx.fillText("RARE CACHE OPENED!", canvas.width/2, 200);
            ctx.fillStyle = '#fff'; ctx.font = '20px Courier New'; ctx.fillText(`Looted: ${currentLootDisplay.name}`, canvas.width/2, 260);
            ctx.fillStyle = '#00ffcc'; ctx.font = '16px Courier New'; ctx.fillText(`Effects: ${formatItemStats(currentLootDisplay)}`, canvas.width/2, 300); ctx.textAlign = 'left';
        }
        else if (gameState === 'UPGRADE_MENU') {
            ctx.fillStyle = 'rgba(0, 10, 20, 0.9)'; ctx.fillRect(50, 50, 700, 500); ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2; ctx.strokeRect(50, 50, 700, 500);
            ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 24px Courier New'; ctx.fillText("CYBERNETICS ENHANCEMENT", 80, 80);
            ctx.fillStyle = '#fff'; ctx.font = '18px Courier New'; ctx.fillText(`Unallocated Points: ${player.skillPoints}`, 80, 120);
            const startY = 200;
            for (let i = 0; i < upgradeMenu.options.length; i++) {
                ctx.fillStyle = i === upgradeMenu.index ? '#00ffcc' : '#fff'; ctx.fillText(i === upgradeMenu.index ? '>> ' : '   ', 80, startY + (i * 40));
                ctx.fillText(upgradeMenu.options[i] !== 'exit' ? `${upgradeMenu.labels[i]}` : upgradeMenu.labels[i], 120, startY + (i * 40));
                if (upgradeMenu.options[i] !== 'exit') ctx.fillText(`[ ${player.stats[upgradeMenu.options[i]]} ]`, 450, startY + (i * 40));
            }
        }
        else if (gameState === 'INVENTORY_MENU') {
            ctx.fillStyle = 'rgba(0, 10, 20, 0.9)'; ctx.fillRect(50, 50, 700, 500); ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2; ctx.strokeRect(50, 50, 700, 500);
            ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 24px Courier New'; ctx.fillText("ARSENAL & GEAR", 80, 60);
            ctx.fillStyle = '#00aaff'; ctx.font = '14px Courier New'; ctx.fillText(`CORE AMULET [${player.amulet.length}/4]: ${player.amulet.length > 0 ? player.amulet.join(', ') : 'NONE'}`, 80, 90);
            const p = player.pet; ctx.fillStyle = '#ffaa00'; ctx.fillText(`COMPANION: ${p ? p.name + ' (STR x'+p.multStr+', TECH x'+p.multTech+', SPD x'+p.multSpd+', HP x'+p.multHp+', XP x'+p.multXp+')' : 'NONE'}`, 80, 110);
            ctx.fillStyle = '#ff00cc'; const g = player.gear;
            ctx.fillText(`WEAPON:    ${g.weapon ? g.weapon.name + ' [' + formatItemStats(g.weapon) + ']' : 'NONE'}`, 80, 140);
            ctx.fillText(`ARMOR:     ${g.armor ? g.armor.name + ' [' + formatItemStats(g.armor) + ']' : 'NONE'}`, 80, 160);
            ctx.fillText(`SHOES:     ${g.shoes ? g.shoes.name + ' [' + formatItemStats(g.shoes) + ']' : 'NONE'}`, 80, 180);
            ctx.fillText(`ACCESSORY: ${g.accessory ? g.accessory.name + ' [' + formatItemStats(g.accessory) + ']' : 'NONE'}`, 80, 200);

            ctx.fillStyle = '#fff'; ctx.font = '16px Courier New'; const startY = 240;
            if (player.inventory.length === 0) ctx.fillText("Stash is empty.", 80, startY);
            else {
                for (let i = 0; i < player.inventory.length; i++) {
                    const item = player.inventory[i]; ctx.fillStyle = i === inventoryMenu.index ? '#00ffcc' : '#fff';
                    const isEq = (g[item.slot] === item) ? "[E]" : "   ";
                    ctx.fillText(`${i === inventoryMenu.index ? '>> ' : '   '}${isEq} ${item.name} (${item.slot}) - ${formatItemStats(item)}`, 80, startY + (i * 22));
                }
            }
            const exitIdx = player.inventory.length; ctx.fillStyle = inventoryMenu.index === exitIdx ? '#00ffcc' : '#aaa';
            ctx.fillText(inventoryMenu.index === exitIdx ? '>> CLOSE INVENTORY' : '   CLOSE INVENTORY', 80, startY + (Math.max(1, player.inventory.length) * 22) + 30);
        }
        else if (gameState === 'LOADING_ENCOUNTER' || gameState === 'LOADING_STORY') {
            ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = encounterType === 'BOSS' ? '#ff0055' : (encounterType === 'TOURNAMENT' ? '#cc00ff' : '#00ffcc'); ctx.font = '24px Courier New'; ctx.textAlign = 'center';
            const text = encounterType === 'BOSS' ? "⚠️ OMEGA THREAT ENGAGED ⚠️" : "✨ NEURAL LINK ACTIVE ✨"; ctx.fillText(text, canvas.width/2, canvas.height/2); ctx.textAlign = 'left';
        }
        else if (gameState === 'COMBAT') {
            drawPlayerCharacter(ctx, 150, 450, globalTime, false, true); drawEnemyCharacter(ctx, 600, 350, globalTime, enemy); 
            for (const p of combat.particles) { ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.font = 'bold 30px Courier New'; ctx.fillText(p.text, p.x, p.y); ctx.globalAlpha = 1.0; }

            ctx.fillStyle = 'rgba(0, 10, 20, 0.9)'; ctx.fillRect(20, 450, 350, 130); ctx.fillRect(390, 450, 390, 130);
            ctx.strokeStyle = encounterType === 'BOSS' ? '#ff0055' : '#00ffcc'; ctx.strokeRect(20, 450, 350, 130); ctx.strokeRect(390, 450, 390, 130);

            ctx.fillStyle = '#fff'; ctx.font = '18px Courier New'; ctx.fillText(`${player.name} [LVL ${player.level}]`, 40, 480);
            ctx.fillText(`HP: ${player.hp}/${player.maxHp}`, 40, 510); ctx.fillText(`MP: ${player.mp}/${player.maxMp}`, 40, 540);
            
            if (player.activeCurse) { ctx.fillStyle = '#f00'; ctx.font = '12px Courier New'; ctx.fillText(`[CURSE: ${player.activeCurse}]`, 40, 450); }
            if (player.activeBlessing) { ctx.fillStyle = '#fd0'; ctx.font = '12px Courier New'; ctx.fillText(`[BLESSING: ${player.activeBlessing}]`, 40, 450); }
            
            ctx.fillStyle = enemy.color; ctx.textAlign = 'right'; ctx.font = '18px Courier New'; ctx.fillText(`${enemy.name} [HP: ${enemy.hp}]`, 760, 440); ctx.textAlign = 'left';

            ctx.beginPath(); ctx.arc(300, 510, 30, 0, Math.PI * 2); ctx.strokeStyle = '#333'; ctx.lineWidth = 8; ctx.stroke();
            ctx.beginPath(); ctx.arc(300, 510, 30, -Math.PI/2, (-Math.PI/2) + ((player.atb / player.maxAtb) * Math.PI * 2)); ctx.strokeStyle = player.atb >= player.maxAtb ? '#00ffcc' : '#00aa88'; ctx.stroke();

            if (combat.turnState === 'PLAYER_ACTION') {
                for (let i = 0; i < combat.options.length; i++) { ctx.fillStyle = (i === combat.menuIndex) ? '#00ffcc' : '#aaa'; ctx.fillText((i === combat.menuIndex ? '> ' : '  ') + combat.options[i], 410, 490 + (i * 30)); }
            } else if (combat.turnState === 'AWAITING_HACK') { ctx.fillStyle = '#ff00cc'; ctx.fillText("Overriding...", 410, 490);
            } else { ctx.fillStyle = '#666'; ctx.fillText("Awaiting Turn...", 410, 490); }

            if (combat.messageTimer > 0) { ctx.fillStyle = encounterType === 'BOSS' ? '#ff0055' : '#fff'; ctx.textAlign = 'center'; wrapText(combat.message, canvas.width/2, 100, 700, 24); ctx.textAlign = 'left'; }
        } 
        else if (gameState === 'GAME_OVER') {
            ctx.fillStyle = 'rgba(255, 0, 85, 0.3)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#fff'; ctx.font = '40px Courier New'; ctx.textAlign = 'center'; ctx.fillText("SYSTEM FAILURE", canvas.width/2, canvas.height/2);
        }

        ctx.filter = 'none';

        if (gameState !== 'CHARACTER_CREATION' && gameState !== 'GAME_OVER') {
            vPad.draw(ctx, gameState);
        }
    }

    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        let deltaTime = (timestamp - lastTime) / 1000; lastTime = timestamp;
        if (deltaTime > 0.1) deltaTime = 0.1;
        update(deltaTime); draw(); requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
</script>
